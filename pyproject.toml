[project]
name = "ia700-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aksil-Irbouh", email = "aksilirbouh@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "streamlit>=1.65.0",
]

[project.scripts]
ia700-project = "ia700_project:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 79
src = ["src"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/W = PEP 8, F = erreurs (imports inutilisés...), D = docstrings, I = tri des imports
select = ["E", "W", "F", "D", "I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["unit_tests"]
addopts = [
    "--cov=ia700_project.analysis",
    "--cov=ia700_project.cleaning",
    "--cov=ia700_project.routes_metrics",
    "--cov=ia700_project.dashboards",
    "--cov=ia700_project.map_rates",
    "--cov=ia700_project.map_view",
    "--cov=ia700_project.sidebar",
    "--cov=ia700_project.indicators",
    "--cov=ia700_project.data",
    "--cov=ia700_project.download_data",
    "--cov=ia700_project.models",
    "--cov-report=term-missing",
    "--cov-fail-under=90"
]